<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120">
  <rect width="120" height="120" fill="none"/>
  <!-- Diagonal lines: editorial texture -->
  <line x1="0" y1="120" x2="120" y2="0" stroke="#7B2FD6" stroke-width="0.3" stroke-opacity="0.12"/>
  <line x1="-60" y1="120" x2="60" y2="0" stroke="#7B2FD6" stroke-width="0.3" stroke-opacity="0.12"/>
  <line x1="60" y1="120" x2="180" y2="0" stroke="#7B2FD6" stroke-width="0.3" stroke-opacity="0.12"/>
</svg>
